[project]
name = "masterplanner"
version = "0.1.0"
description = "Master planning / bond sizing engine for CCRC (life plan community) scenario modeling"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["master_planning*", "bond_sizing*", "ratio_analytics*", "shared*"]
